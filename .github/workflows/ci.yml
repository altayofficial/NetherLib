name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets, openssl, gmp
          tools: phpize, php-config

      - name: Checkout ext-datachannel
        uses: actions/checkout@v5
        with:
          repository: altayofficial/ext-datachannel
          ref: 0.1.1
          path: ext-datachannel
          submodules: recursive

      - name: Install libdatachannel build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev pkg-config

      - name: Build libdatachannel and ext-datachannel
        working-directory: ext-datachannel
        run: |
          cmake -S deps/libdatachannel -B $RUNNER_TEMP/libdatachannel-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DNO_MEDIA=ON -DNO_WEBSOCKET=ON -DNO_EXAMPLES=ON -DNO_TESTS=ON -DUSE_NICE=OFF -DUSE_NETTLE=OFF \
            -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/libdatachannel
          ninja -C $RUNNER_TEMP/libdatachannel-build install
          phpize
          ./configure --with-datachannel=$RUNNER_TEMP/libdatachannel
          make -j$(nproc)
          sudo make install
          echo "extension=datachannel.so" | sudo tee $(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-datachannel.ini

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test
